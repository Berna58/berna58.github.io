# Verificação de qualidade em cada push e pull request.
# Corre sem segredos: o conteúdo vem do seed local (supabase/seed).
name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # o gitleaks analisa o histórico completo

      - name: Procurar segredos no repositório
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 (fixado por SHA: recebe o GITHUB_TOKEN)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run check

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build

      - name: Testes e2e e acessibilidade
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Lighthouse (orçamentos de qualidade)
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Guardar relatórios em caso de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
